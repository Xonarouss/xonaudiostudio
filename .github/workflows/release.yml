name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish Release Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Standalone Portable ZIP
        run: |
          python scripts/build_release_zip.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "XonAudio Studio v1.3.0 — AI Song Cover Lab, BS-RoFormer, RVC v2 & Hi-Fi Dual Export"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            XonAudio-Studio-v1.3.0-Portable.zip
          body: |
            ## 🎙️ XonAudio Studio v1.3.0
            ### The Sovereign Local AI Audio Workstation • AI Song Cover Lab • 3 Voice Engines • 3 SFX Engines
            **Built with passion by [Xonarous Inc](https://xonarous.nl)**

            [![Windows](https://img.shields.io/badge/Platform-Windows%2010%20%2F%2011%20x64-blue.svg?style=for-the-badge&logo=windows)](https://xonarous.nl)
            [![CUDA](https://img.shields.io/badge/CUDA-12.8%2B%20%7C%20PyTorch%202.12-green.svg?style=for-the-badge&logo=nvidia)](https://xonarous.nl)
            [![Architecture](https://img.shields.io/badge/Architecture-Blackwell%20sm__120%20%7C%20Ada%20%7C%20Ampere-purple.svg?style=for-the-badge)](https://xonarous.nl)
            [![Dutch](https://img.shields.io/badge/🇳🇱%20Dutch%20TTS-Supported%20(XTTS%20+%20Fish)-orange.svg?style=for-the-badge)](https://xonarous.nl)

            ---

            ### 📦 Quickstart (Standalone Portable ZIP)
            1. Download `XonAudio-Studio-v1.3.0-Portable.zip` below.
            2. Extract anywhere on your Windows PC (e.g. `D:\XonAudio`).
            3. Double-click `Start_AudioStudio.bat`. All dependencies and neural models are automatically verified and initialized on launch!

            ---

            ### 🚀 What's New in v1.3.0:
            - **🎵 AI Song Cover Lab:** 4-stage pipeline `[Audio Ingestion ➔ BS-RoFormer Vocal Isolation ➔ RVC v2 Neural Voice Conversion ➔ Hi-Fi Mastering]`.
            - **⚡ BS-RoFormer Vocal Separator:** SOTA 12.97 SDR stem separation on CUDA isolating vocals and instrumental stems cleanly.
            - **🎤 RVC v2 + RMVPE Pitch Engine:** High-precision singing voice conversion with 100 FPS RMVPE F0 tracking, bit-exact pure-PyTorch HuBERT base encoder, and unvoiced consonant protection.
            - **✨ Instant Voice Cloning for Covers:** Clone any singer by uploading 10-30s audio sample, or select any .pth voice model.
            - **💎 Dual Studio Mastering Export:** Export full mix, vocals, and instrumental stems in both **320 kbps MP3** and **24-bit PCM WAV**.
            - **🗃️ Generations Library Integration:** Song cover mixes, vocals, and instrumentals are now archived directly in the Generations Library.
            - **🎛️ Triple SFX Diffusion Suite:** Stable Audio 3 Medium DiT, Stable Audio Open 1.0, and AudioLDM 2 with intelligent negative prompt sanitization.
            - **🗣️ 3-Engine Voice Lab:** F5-TTS, XTTS-v2, and Fish Speech 1.5 with native **Dutch (🇳🇱)** support and laughter cues.
            - **🪄 Llama 3 Magic Wand & AI Co-Pilot:** Built-in prompt engineer and real-time audio advisor.
            - **📊 Live Hardware Telemetry:** NVML GPU %, temperature (°C), VRAM, Watts, RAM, and CPU.

            ---
            *Built and maintained by [Xonarous Inc](https://xonarous.nl). MIT Licensed.*

